[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autose-platform"
version = "0.1.0"
description = "Autonomous Solution Engineering Platform - Multi-agent system for enterprise solution engineering"
readme = "README.md"
authors = [
    {name = "AutoSE Team", email = "team@autose.example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "hypothesis>=6.92.2",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]
prod = [
    "redis>=5.0.1",
    "gunicorn>=21.2.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
]

[project.urls]
Homepage = "https://github.com/example/autose-platform"
Documentation = "https://autose-platform.readthedocs.io/"
Repository = "https://github.com/example/autose-platform"
Issues = "https://github.com/example/autose-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
autose-platform = "autose_platform.main:app"